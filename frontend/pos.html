<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Menu | Om Ben Billiard</title>
    <link rel="stylesheet" href="assets/style.css">
    <style>
        .pos-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            align-items: start;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
        }
        .menu-item-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            padding: 1rem;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .menu-item-card:hover {
            border-color: var(--primary-color);
            transform: translateY(-3px);
        }
        .menu-item-card.out-of-stock {
            opacity: 0.5;
            filter: grayscale(1);
            cursor: not-allowed;
            border-color: var(--danger);
        }
        .cart-panel {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            padding: 1.5rem;
            border-radius: 20px;
            position: sticky;
            top: 2rem;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 0;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
        }
        .qty-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
        }
        .qty-btn:hover { background: var(--primary-green); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-section">
                <img src="assets/logo.png" alt="Logo" class="main-logo">
                <div>
                    <h1>OM BEN BILLIARD</h1>
                    <p>X V3 KARAOKE POS System</p>
                </div>
            </div>
            <nav></nav>
        </header>

        <script src="assets/app.js"></script>
        <script>renderNavbar('pos');</script>

        <section class="pos-layout">
            <!-- Left: Menu Catalog -->
            <div>
                <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap;">
                    <h2 style="font-family: var(--font-heading); margin: 0;">Daftar Menu</h2>
                    <div class="form-group" style="margin: 0; flex: 1; min-width: 200px;">
                        <input type="text" id="search-menu" placeholder="Cari menu (Ketik nama...)" oninput="filterMenu()" style="background: rgba(255,255,255,0.1); border-radius: 12px; padding: 0.7rem 1rem;">
                    </div>
                </div>

                <!-- Category Tabs -->
                <div id="category-tabs" style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem; overflow-x: auto; padding-bottom: 0.5rem; scrollbar-width: none;">
                    <!-- Categories injected here -->
                </div>

                <div id="menu-container">
                    <!-- Categorized menu injected here -->
                </div>
            </div>

            <!-- Right: Cart -->
            <div class="cart-panel">
                <h2 style="font-family: var(--font-heading); margin-bottom: 1rem;">Keranjang</h2>
                <div class="form-group">
                    <input type="text" id="customer-name" placeholder="Nama Pelanggan (Opsional)" style="padding: 0.5rem; font-size: 0.9rem;">
                </div>
                
                <div id="cart-items" style="min-height: 200px; max-height: 400px; overflow-y: auto; margin-bottom: 1rem;">
                    <!-- Cart items injected here -->
                    <div style="text-align:center; padding: 2rem; color:var(--text-dim); font-size: 0.9rem;">Belum ada pesanan</div>
                </div>

                <div style="display: flex; justify-content: space-between; font-size: 1.2rem; margin-bottom: 1.5rem; padding-top: 1rem; border-top: 2px solid rgba(255,255,255,0.1);">
                    <strong>Total:</strong>
                    <strong id="cart-total" style="color: var(--accent-gold);">Rp 0</strong>
                </div>

                <button class="btn btn-primary" id="checkout-btn" onclick="checkout()" disabled>Bayar & Cetak Struk</button>
            </div>
        </section>
    </div>

    <!-- Success Modal -->
    <div class="modal" id="success-modal">
        <div class="modal-content" style="text-align: center;">
            <h2 style="margin-bottom: 1rem; color: var(--success); font-family: var(--font-heading);">Pembayaran Berhasil!</h2>
            <p style="color: var(--text-dim); margin-bottom: 2rem;">Pesanan langsung Menu telah dicatat.</p>
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <button class="btn btn-outline" onclick="closeSuccess()">Menu Utama</button>
                <button class="btn btn-outline" id="btn-print-pos" style="color: var(--accent-gold); border-color: rgba(240, 192, 64, 0.3);">Cetak Struk</button>
            </div>
        </div>
    </div>

    <script>
        let menuData = [];
        let cart = [];
        let lastTransaction = null;
        let activeCategory = 'Semua';

        async function loadMenu() {
            menuData = await fetchData('/menu');
            renderCategories();
            renderMenu();
        }

        function renderCategories() {
            const tabs = document.getElementById('category-tabs');
            const categories = ['Semua', ...new Set(menuData.map(item => item.category))];
            
            tabs.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `btn ${activeCategory === cat ? 'btn-primary' : 'btn-outline'}`;
                btn.style.width = 'auto';
                btn.style.padding = '0.5rem 1.2rem';
                btn.style.fontSize = '0.85rem';
                btn.textContent = cat;
                btn.onclick = () => {
                    activeCategory = cat;
                    renderCategories();
                    renderMenu();
                };
                tabs.appendChild(btn);
            });
        }

        function filterMenu() {
            renderMenu();
        }

        function renderMenu() {
            const container = document.getElementById('menu-container');
            const searchQuery = document.getElementById('search-menu').value.toLowerCase();
            container.innerHTML = '';

            let filtered = menuData.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(searchQuery);
                const matchesCategory = activeCategory === 'Semua' || item.category === activeCategory;
                return matchesSearch && matchesCategory;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 3rem; color:var(--text-dim);">Menu tidak ditemukan.</div>';
                return;
            }

            // Group by category
            const grouped = filtered.reduce((acc, item) => {
                if (!acc[item.category]) acc[item.category] = [];
                acc[item.category].push(item);
                return acc;
            }, {});

            for (const category in grouped) {
                const section = document.createElement('div');
                section.style.marginBottom = '2rem';
                section.innerHTML = `
                    <h3 style="font-size: 0.9rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 1rem; border-left: 3px solid var(--primary-color); padding-left: 0.5rem;">${category}</h3>
                    <div class="menu-grid"></div>
                `;
                const grid = section.querySelector('.menu-grid');
                
                grouped[category].forEach(item => {
                    const isOutOfStock = (item.stock || 0) <= 0;
                    const card = document.createElement('div');
                    card.className = `menu-item-card ${isOutOfStock ? 'out-of-stock' : ''}`;
                    if (!isOutOfStock) card.onclick = () => addToCart(item);
                    
                    card.innerHTML = `
                        <div style="font-weight: 600; margin-bottom: 0.5rem;">${item.name}</div>
                        <div style="color: var(--accent-gold); font-size: 0.9rem; margin-bottom: 0.5rem;">${formatRupiah(item.price)}</div>
                        <div style="font-size: 0.75rem; color: ${isOutOfStock ? 'var(--danger)' : 'var(--text-dim)'};">
                            ${isOutOfStock ? 'STOK HABIS' : 'Stok: ' + (item.stock || 0)}
                        </div>
                    `;
                    grid.appendChild(card);
                });
                container.appendChild(section);
            }
        }

        function addToCart(item) {
            const existing = cart.find(c => c.itemId === item.id);
            const currentQty = existing ? existing.quantity : 0;
            
            if (currentQty >= item.stock) {
                alert(`Maaf, stok ${item.name} tidak mencukupi.`);
                return;
            }
            if (existing) {
                existing.quantity++;
                existing.subtotal = existing.quantity * existing.price;
            } else {
                cart.push({
                    itemId: item.id,
                    name: item.name,
                    price: item.price,
                    quantity: 1,
                    subtotal: item.price
                });
            }
            renderCart();
        }

        function updateQty(itemId, delta) {
            const item = cart.find(c => c.itemId === itemId);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    cart = cart.filter(c => c.itemId !== itemId);
                } else {
                    item.subtotal = item.quantity * item.price;
                }
                renderCart();
            }
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');
            const checkoutBtn = document.getElementById('checkout-btn');

            if (cart.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 2rem; color:var(--text-dim); font-size: 0.9rem;">Belum ada pesanan</div>';
                totalEl.textContent = 'Rp 0';
                checkoutBtn.disabled = true;
                return;
            }

            container.innerHTML = '';
            let total = 0;
            cart.forEach(item => {
                total += item.subtotal;
                container.innerHTML += `
                    <div class="cart-item">
                        <div style="flex: 1;">
                            <div style="font-weight: 500; font-size: 0.9rem;">${item.name}</div>
                            <div style="color: var(--accent-gold); font-size: 0.8rem;">${formatRupiah(item.price)}</div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 0.5rem;">
                            <button class="qty-btn" onclick="updateQty(${item.itemId}, -1)">-</button>
                            <span style="width: 20px; text-align: center; font-size: 0.9rem;">${item.quantity}</span>
                            <button class="qty-btn" onclick="updateQty(${item.itemId}, 1)">+</button>
                        </div>
                    </div>
                `;
            });

            totalEl.textContent = formatRupiah(total);
            checkoutBtn.disabled = false;
        }

        async function checkout() {
            if (cart.length === 0) return;
            
            const total = cart.reduce((acc, item) => acc + item.subtotal, 0);
            const customerName = document.getElementById('customer-name').value;

            const res = await postData('/transactions/pos', {
                customerName: customerName,
                orders: cart,
                totalAmount: total
            });

            if (res) {
                lastTransaction = res;
                document.getElementById('success-modal').style.display = 'flex';
                
                // Clear cart
                cart = [];
                document.getElementById('customer-name').value = '';
                renderCart();
            }
        }

        document.getElementById('btn-print-pos').onclick = () => {
            if (!lastTransaction) return;
            printReceipt(lastTransaction);
        };

        function closeSuccess() {
            document.getElementById('success-modal').style.display = 'none';
        }
        setInterval(loadMenu, 1000);
        loadMenu();
    </script>
</body>
</html>
