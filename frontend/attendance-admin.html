<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Staff Dashboard | Admin Om Ben</title>
    <link rel="stylesheet" href="assets/style.css">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-blue: #00f3ff;
            --neon-gold: #facd15;
            --deep-dark: #0a0a12;
            --premium-pink: #ff007a;
        }

        body {
            background: radial-gradient(circle at top right, #1a1a2e, #0a0a12);
        }

        .stats-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.2rem;
            margin-bottom: 2rem;
        }

        .stat-card-premium {
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            border: 1px solid var(--glass-border);
            padding: 1.2rem;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .stat-card-premium.active-emp {
            border-color: var(--neon-blue);
            background: rgba(0,243,255,0.05);
            box-shadow: 0 0 20px rgba(0,243,255,0.1);
        }

        .stat-card-premium .val {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0.3rem 0;
            background: linear-gradient(to right, #fff, var(--text-dim));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-card-premium .label {
            color: var(--text-dim);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .admin-grid-lux {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 2rem;
        }

        @media (max-width: 1100px) {
            .admin-grid-lux { grid-template-columns: 1fr; }
        }

        .panel-lux {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
        }

        .lux-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }

        .lux-table tr td {
            padding: 1rem;
            background: rgba(255,255,255,0.01);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .lux-table tr.selected td {
            background: rgba(0,243,255,0.08);
            border-color: var(--neon-blue);
        }

        .lux-table tr:hover td {
            background: rgba(255,255,255,0.04);
        }

        .lux-table tr td:first-child { border-radius: 12px 0 0 12px; border-left: 1px solid var(--glass-border); }
        .lux-table tr td:last-child { border-radius: 0 12px 12px 0; border-right: 1px solid var(--glass-border); }
        .lux-table tr td { border-top: 1px solid var(--glass-border); border-bottom: 1px solid var(--glass-border); }

        .type-badge {
            font-size: 0.65rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 700;
        }

        .badge-in { background: rgba(0,243,255,0.1); color: var(--neon-blue); }
        .badge-out { background: rgba(250,204,21,0.1); color: var(--neon-gold); }

        .btn-lux {
            background: linear-gradient(135deg, var(--primary-color), #4facfe);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .emp-name {
            color: #fff;
        }

        .scroll-container {
            max-height: 500px;
            overflow-y: auto;
        }

        .emp-card-mini {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .emp-avatar {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(45deg, var(--neon-blue), var(--primary-color));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: white;
            font-size: 1.2rem;
        }

        #personal-stats {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(0,243,255,0.03);
            border-radius: 15px;
            border: 1px dashed var(--neon-blue);
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .panel-lux { border: none !important; background: transparent !important; }
        }

        /* ===== LIGHT MODE OVERRIDES untuk Tab Staff ===== */
        body.light-mode {
            background: linear-gradient(135deg, #eef2f7, #f5f7fa) !important;
        }

        body.light-mode .panel-lux {
            background: rgba(255, 255, 255, 0.9) !important;
            border-color: rgba(0, 0, 0, 0.1) !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.07);
        }

        body.light-mode .stat-card-premium {
            background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(240,244,250,0.9)) !important;
            border-color: rgba(0, 0, 0, 0.1) !important;
            box-shadow: 0 4px 20px rgba(0,0,0,0.07);
        }

        body.light-mode .stat-card-premium.active-emp {
            border-color: var(--primary-color) !important;
            background: rgba(0, 153, 204, 0.05) !important;
        }

        /* Fix gradient text (putih) di light mode */
        body.light-mode .stat-card-premium .val {
            background: linear-gradient(to right, #1a1a2e, #0099cc) !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
        }

        /* Fix warna nama karyawan yang hardcode #fff */
        body.light-mode .lux-table td div[style*="color: #fff"],
        body.light-mode .lux-table td div[style*="color:#fff"] {
            color: #1a1a2e !important;
        }

        /* Fix table rows */
        body.light-mode .lux-table tr td {
            background: rgba(0, 0, 0, 0.02) !important;
            border-color: rgba(0, 0, 0, 0.08) !important;
            color: #1a1a2e !important;
        }

        body.light-mode .lux-table tr.selected td {
            background: rgba(0, 153, 204, 0.07) !important;
            border-color: var(--primary-color) !important;
        }

        body.light-mode .lux-table tr:hover td {
            background: rgba(0, 0, 0, 0.04) !important;
        }

        body.light-mode .lux-table tr td:first-child {
            border-left-color: rgba(0, 0, 0, 0.08) !important;
        }
        body.light-mode .lux-table tr td:last-child {
            border-right-color: rgba(0, 0, 0, 0.08) !important;
        }

        /* Fix thead th */
        body.light-mode .lux-table thead th {
            color: #555570 !important;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        /* Fix badge warna neon di light mode */
        body.light-mode .badge-in {
            background: rgba(0, 153, 204, 0.12) !important;
            color: #007aa3 !important;
        }

        body.light-mode .badge-out {
            background: rgba(180, 130, 0, 0.12) !important;
            color: #9a6f00 !important;
        }

        /* Fix warna heading neon */
        body.light-mode h3[style*="color: var(--neon-blue)"] {
            color: #007aa3 !important;
        }

        body.light-mode h3[style*="color: var(--neon-gold)"] {
            color: #9a6f00 !important;
        }

        /* Fix personal stats panel */
        body.light-mode #personal-stats {
            background: rgba(0, 153, 204, 0.05) !important;
            border-color: rgba(0, 153, 204, 0.3) !important;
        }

        /* Fix btn-lux di light mode */
        body.light-mode .btn-lux {
            background: linear-gradient(135deg, var(--primary-color), #0077aa) !important;
            color: #fff !important;
        }

        /* Fix emp-avatar */
        body.light-mode .emp-avatar {
            background: linear-gradient(45deg, #0099cc, #0077aa) !important;
        }

        /* Fix nama karyawan */
        body.light-mode .emp-name {
            color: #1a1a2e !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="no-print">
            <div class="logo-section">
                <img src="assets/Logo Baru.jpeg" alt="Logo" class="main-logo">
                <div>
                    <h1>OM BEN BILLIARD</h1>
                    <p>X V3 KARAOKE Staff Analytics</p>
                </div>
            </div>
            <nav></nav>
        </header>

        <script src="assets/app.js"></script>
        <script>renderNavbar('attendance-admin');</script>

        <div class="stats-overview no-print">
            <div class="stat-card-premium">
                <div class="label">Total Staf</div>
                <div class="val" id="stat-total-emp">0</div>
            </div>
            <div class="stat-card-premium">
                <div class="label">Hadir Hari Ini</div>
                <div class="val" id="stat-present-today">0</div>
            </div>
            <div class="stat-card-premium" id="personal-active-card" style="display: none;">
                <div class="label">Fokus Staf</div>
                <div class="val" id="fokus-name" style="font-size: 1rem; background: linear-gradient(to right, var(--neon-blue), #fff); -webkit-background-clip: text;">-</div>
                <button class="btn" style="padding: 0; font-size: 0.6rem; color: var(--danger);" onclick="clearFilter()">✖ Batalkan Fokus</button>
            </div>
        </div>

        <div class="admin-grid-lux">
            <!-- Left: Directory -->
            <div class="panel-lux">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h3 style="margin: 0; font-size: 0.9rem; color: var(--neon-blue); letter-spacing: 1px;">DATABASE KARYAWAN</h3>
                    <div style="display: flex; gap: 0.5rem;">
                        <button class="btn no-print" style="width: auto; padding: 2px 8px; font-size: 0.6rem; color: var(--danger); border: 1px solid rgba(231,76,60,0.3); border-radius: 8px;" onclick="resetEmployees()">RESET SEMUA</button>
                        <button class="btn-lux no-print" style="padding: 0.4rem 0.8rem; font-size: 0.75rem;" onclick="openAddEmpModal()">+ ADD</button>
                    </div>
                </div>
                
                <div class="scroll-container">
                    <table class="lux-table">
                        <tbody id="employee-list"></tbody>
                    </table>
                </div>

                <!-- Personal Stats Panel -->
                <div id="personal-stats" class="no-print">
                    <div style="text-align: center;">
                        <div style="font-size: 0.6rem; color: var(--text-dim);">MASUK (BLN INI)</div>
                        <div id="p-total-in" style="font-weight: 800; color: var(--neon-blue);">0</div>
                    </div>
                    <div style="text-align: center;">
                        <div style="font-size: 0.6rem; color: var(--text-dim);">TERAKHIR ABSEN</div>
                        <div id="p-last-date" style="font-weight: 800; font-size: 0.6rem;">-</div>
                    </div>
                    <div style="text-align: center;">
                        <div style="font-size: 0.6rem; color: var(--text-dim);">RASIO HADIR</div>
                        <div id="p-ratio" style="font-weight: 800; color: var(--neon-gold);">0%</div>
                    </div>
                </div>
            </div>

            <!-- Right: Logs -->
            <div class="panel-lux">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
                    <h3 style="margin: 0; font-size: 1rem; color: var(--neon-gold);" id="attendance-title">SEMUA RIWAYAT</h3>
                    <div style="display: flex; gap: 0.5rem;" class="no-print">
                        <button class="btn no-print" style="width: auto; font-size: 0.6rem; color: var(--danger); border: 1px solid rgba(231,76,60,0.3); border-radius: 8px; padding: 4px 8px;" onclick="resetAllLogs()">RESET SEMUA LOGS</button>
                        <button class="btn btn-outline" style="width: auto; font-size: 0.7rem; padding: 4px 10px;" onclick="setFilter('today')">HARI INI</button>
                        <button class="btn btn-outline" style="width: auto; font-size: 0.7rem; padding: 4px 10px;" onclick="setFilter('week')">MINGGU</button>
                        <button class="btn btn-outline" style="width: auto; font-size: 0.7rem; padding: 4px 10px;" onclick="setFilter('month')">BULAN</button>
                        <button class="btn-lux" style="font-size: 0.7rem; padding: 4px 10px;" onclick="printStaffReport()">PRINT REKAP</button>
                    </div>
                </div>
                <div class="scroll-container">
                    <table class="lux-table">
                        <thead>
                            <tr>
                                <th>TANGGAL & WAKTU</th>
                                <th>NAMA KARYAWAN</th>
                                <th style="text-align: center;">STATUS</th>
                            </tr>
                        </thead>
                        <tbody id="attendance-history"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Registrasi -->
    <div class="modal" id="emp-modal">
        <div class="modal-content" style="border: 1px solid var(--glass-border); border-radius: 20px;">
            <h2 style="margin-bottom: 1.5rem; font-family: var(--font-heading);">Tambah Staf Baru</h2>
            <form id="emp-form">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="emp-name" required>
                </div>
                <div class="form-group">
                    <label>Jabatan</label>
                    <input type="text" id="emp-role" list="role-options" required>
                    <datalist id="role-options">
                        <option value="Kasir Elite"><option value="Operator Senior"><option value="Manager"><option value="Wasit"><option value="Lc Professional">
                    </datalist>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="btn btn-outline" onclick="document.getElementById('emp-modal').style.display='none'">BATAL</button>
                    <button type="submit" class="btn-lux" style="flex: 1;">SIMPAN</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let allEmployees = [];
        let allAttendance = [];
        let currentFilter = 'all';
        let selectedEmployee = null;

        async function loadData() {
            const employees = await fetchData('/employees');
            const attendance = await fetchData('/attendance');
            
            // Only update if data actually changed to prevent flicker
            const empChanged = JSON.stringify(allEmployees) !== JSON.stringify(employees);
            const attChanged = JSON.stringify(allAttendance) !== JSON.stringify(attendance);

            if (empChanged) {
                allEmployees = employees;
                renderEmployees();
            }
            if (attChanged) {
                allAttendance = attendance;
                renderAttendance();
            }
            if (empChanged || attChanged) {
                updateTopStats();
            }
        }

        function updateTopStats() {
            const nowStr = getSyncedNow().toISOString().split('T')[0];
            const presentToday = new Set(allAttendance.filter(a => a.timestamp.startsWith(nowStr)).map(a => a.employeeName)).size;
            
            document.getElementById('stat-total-emp').textContent = allEmployees.length;
            document.getElementById('stat-present-today').textContent = presentToday;
        }

        function renderEmployees() {
            const list = document.getElementById('employee-list');
            list.innerHTML = '';
            allEmployees.forEach(emp => {
                const isSelected = selectedEmployee === emp.name;
                const row = document.createElement('tr');
                if (isSelected) row.className = 'selected';
                row.onclick = () => selectEmployee(emp.name);
                row.innerHTML = `
                    <td>
                        <div class="emp-card-mini">
                            <div class="emp-avatar">${emp.name.charAt(0)}</div>
                            <div>
                                <div class="emp-name" style="font-weight: 700;">${emp.name}</div>
                                <div style="font-size: 0.65rem; color: var(--text-dim);">${emp.role}</div>
                            </div>
                        </div>
                    </td>
                    <td style="text-align: right;">
                        <button class="btn" style="color: var(--danger); font-size: 0.6rem; padding: 4px;" onclick="event.stopPropagation(); deleteEmployee('${emp.id}')">Hapus</button>
                    </td>
                `;
                list.appendChild(row);
            });
        }

        function selectEmployee(name) {
            selectedEmployee = name;
            document.getElementById('personal-active-card').style.display = 'block';
            document.getElementById('fokus-name').textContent = name;
            document.getElementById('personal-stats').style.display = 'grid';
            
            updatePersonalStats(name);
            renderEmployees();
            renderAttendance();
        }

        function clearFilter() {
            selectedEmployee = null;
            document.getElementById('personal-active-card').style.display = 'none';
            document.getElementById('personal-stats').style.display = 'none';
            renderEmployees();
            renderAttendance();
        }

        function updatePersonalStats(name) {
            const now = getSyncedNow();
            const monthStr = now.toISOString().slice(0, 7);
            const userLogs = allAttendance.filter(a => a.employeeName === name);
            const monthInLogs = userLogs.filter(a => a.timestamp.startsWith(monthStr) && a.type === 'in');
            
            document.getElementById('p-total-in').textContent = monthInLogs.length;
            
            if (userLogs.length > 0) {
                const lastLog = new Date(userLogs[0].timestamp);
                document.getElementById('p-last-date').textContent = lastLog.toLocaleDateString('id-ID');
            } else {
                document.getElementById('p-last-date').textContent = '-';
            }

            const ratio = Math.min(100, Math.round((monthInLogs.length / 25) * 100)); // Target 25 hari kerja
            document.getElementById('p-ratio').textContent = ratio + '%';
        }

        function setFilter(f) {
            currentFilter = f;
            renderAttendance();
        }

        function renderAttendance() {
            const list = document.getElementById('attendance-history');
            const title = document.getElementById('attendance-title');
            list.innerHTML = '';
            
            let filtered = [...allAttendance];
            const now = getSyncedNow();
            
            // Employee Filter First
            if (selectedEmployee) {
                filtered = filtered.filter(a => a.employeeName === selectedEmployee);
                title.textContent = `REKAP: ${selectedEmployee.toUpperCase()}`;
            } else {
                title.textContent = "SEMUA RIWAYAT";
            }
            
            // Time Filter Second
            if (currentFilter === 'today') {
                const todayStr = now.toISOString().split('T')[0];
                filtered = filtered.filter(a => a.timestamp.startsWith(todayStr));
                title.textContent += " (HARI INI)";
            } else if (currentFilter === 'week') {
                const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                filtered = filtered.filter(a => new Date(a.timestamp) >= weekAgo);
                title.textContent += " (7 HARI)";
            } else if (currentFilter === 'month') {
                const monthStr = now.toISOString().slice(0, 7);
                filtered = filtered.filter(a => a.timestamp.startsWith(monthStr));
                title.textContent += " (BULAN INI)";
            }

            filtered.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp)).forEach(a => {
                const date = new Date(a.timestamp);
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>
                        <div style="font-weight: 600;">${date.toLocaleDateString('id-ID')}</div>
                        <div style="font-size: 0.7rem; color: var(--text-dim);">${date.toLocaleTimeString('id-ID')}</div>
                    </td>
                    <td style="font-weight: 600;">${a.employeeName}</td>
                    <td style="text-align: center;">
                        <span class="type-badge ${a.type === 'in' ? 'badge-in' : 'badge-out'}">
                            ${a.type === 'in' ? 'MASUK' : 'KELUAR'}
                        </span>
                    </td>
                `;
                list.appendChild(row);
            });
        }

        async function deleteEmployee(id) {
            if (confirm('Hapus karyawan ini dari sistem?')) {
                const res = await deleteData(`/employees/${id}`);
                if (res && res.success) loadData();
            }
        }

        function openAddEmpModal() {
            document.getElementById('emp-form').reset();
            document.getElementById('emp-modal').style.display = 'flex';
        }

        document.getElementById('emp-form').onsubmit = async (e) => {
            e.preventDefault();
            const res = await postData('/employees', {
                name: document.getElementById('emp-name').value,
                role: document.getElementById('emp-role').value
            });
            if (res) {
                document.getElementById('emp-modal').style.display = 'none';
                loadData();
            }
        };

        async function resetAttendance() {
            if (confirm('Reset absensi hari ini?')) {
                const res = await postData('/attendance/close-shift', {});
                if (res) loadData();
            }
        }

        async function resetEmployees() {
            if (confirm('PERINGATAN: Hapus SELURUH daftar karyawan?')) {
                if (confirm('APAKAH ANDA YAKIN? Data tidak bisa dikembalikan!')) {
                    const res = await postData('/employees/reset', {});
                    if (res) loadData();
                }
            }
        }

        async function resetAllLogs() {
            if (confirm('Hapus SELURUH RIWAYAT absensi dari awal sampai sekarang?')) {
                if (confirm('DATA AKAN HILANG PERMANEN! Lanjutkan?')) {
                    const res = await postData('/attendance/reset-all', {});
                    if (res) loadData();
                }
            }
        }

        function printStaffReport() {
            const table = document.querySelector('#attendance-history').closest('table').cloneNode(true);
            const printWin = window.open('', '_blank');
            const html = `
                <html>
                <head>
                    <title>Laporan Absensi Staf</title>
                    <style>
                        body { font-family: sans-serif; padding: 40px; }
                        h1, h2 { text-align: center; }
                        table { width: 100%; border-collapse: collapse; margin-top: 30px; }
                        th, td { border: 1px solid #000; padding: 10px; text-align: left; }
                        th { background: #f0f0f0; }
                    </style>
                </head>
                <body>
                    <h1>OM BEN BILLIARD X V3 KARAOKE</h1>
                    <h2>${document.getElementById('attendance-title').textContent}</h2>
                    <p style="text-align:right">Dicetak: ${new Date().toLocaleString('id-ID')}</p>
                    ${table.outerHTML}
                    <script>
                        window.onload = function() { window.print(); setTimeout(() => window.close(), 500); }
                    <\/script>
                </body>
                </html>`;
            printWin.document.write(html);
            printWin.document.close();
        }

        // Auto Refresh every 1s for instant real-time monitoring
        setInterval(loadData, 1000);
        loadData();
    </script>
</body>
</html>
