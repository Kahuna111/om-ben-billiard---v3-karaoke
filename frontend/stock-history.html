<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Stok | Admin Om Ben</title>
    <link rel="stylesheet" href="assets/style.css">
    <style>
        .stock-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }
        .stat-box {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            padding: 1.5rem;
            border-radius: 20px;
            text-align: center;
        }
        .stat-box h3 { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 1px; }
        .stat-box .val { font-size: 1.8rem; font-weight: 800; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            margin-top: 1rem;
        }
        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--glass-border);
        }
        th {
            background: rgba(255,255,255,0.05);
            color: var(--text-dim);
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .badge-in { background: rgba(0, 243, 255, 0.1); color: var(--primary-color); border: 1px solid rgba(0, 243, 255, 0.3); }
        .badge-out { background: rgba(255, 71, 87, 0.1); color: #ff4757; border: 1px solid rgba(255, 71, 87, 0.3); }

        @media print {
            header, nav, .filter-bar, .no-print, button { display: none !important; }
            body { background: white !important; color: black !important; padding: 40px !important; }
            table { width: 100% !important; border: 1px solid black !important; color: black !important; border-collapse: collapse !important; }
            th, td { border: 1px solid black !important; padding: 10px !important; color: black !important; background: transparent !important; }
            th { background-color: #f0f0f0 !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="no-print">
            <div class="logo-section">
                <img src="assets/Logo Baru.jpeg" alt="Logo" class="main-logo">
                <div>
                    <h1>OM BEN BILLIARD</h1>
                    <p>X V3 KARAOKE Stock Monitoring</p>
                </div>
            </div>
            <nav></nav>
        </header>

        <script src="assets/app.js"></script>
        <script>renderNavbar('stock-history');</script>

        <section>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;" class="no-print">
                <h2 style="font-family: var(--font-heading); margin: 0;">REKAPITULASI BARANG</h2>
                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: flex-end;">
                    <button class="btn btn-outline" style="width: auto; background: rgba(231, 76, 60, 0.1); color: #e74c3c; border-color: rgba(231, 76, 60, 0.3);" onclick="resetAllStockLogs()">RESET SELURUH RIWAYAT STOK</button>
                    <button class="btn btn-outline" style="width: auto;" onclick="loadLogs()">â†» REFRESH</button>
                    <button class="btn btn-outline no-print" style="width: auto;" onclick="printStockReport()">Cetak Laporan</button>
                </div>
            </div>

            <!-- STOCK STATS -->
            <div class="stock-stats no-print">
                <div class="stat-box">
                    <h3>Total Masuk (+)</h3>
                    <div class="val" id="stat-in" style="color: var(--primary-color);">0</div>
                </div>
                <div class="stat-box">
                    <h3>Total Keluar (-)</h3>
                    <div class="val" id="stat-out" style="color: #ff4757;">0</div>
                </div>
                <div class="stat-box">
                    <h3>Log Aktivitas</h3>
                    <div class="val" id="stat-count" style="color: var(--neon-gold);">0</div>
                </div>
            </div>

            <div class="filter-bar no-print" style="align-items: center;">
                <div class="form-group" style="margin:0; flex: 1; min-width: 250px;">
                    <input type="text" id="search-item" placeholder="Cari Nama Barang..." oninput="filterLogs()">
                </div>
                <select id="filter-type" onchange="filterLogs()" style="padding: 0.5rem 1rem; border-radius: 12px; background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--glass-border);">
                    <option value="all" style="color: black;">SEMUA TIPE</option>
                    <option value="in" style="color: black;">BARANG MASUK (+)</option>
                    <option value="out" style="color: black;">BARANG KELUAR (-)</option>
                </select>
                <select id="filter-category" onchange="filterLogs()" style="padding: 0.5rem 1rem; border-radius: 12px; background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--glass-border);">
                    <option value="all" style="color: black;">SEMUA KATEGORI</option>
                </select>
                <div style="display: flex; align-items: center; gap: 0.5rem; background: rgba(255,255,255,0.05); padding: 0.5rem 1rem; border-radius: 12px; border: 1px solid var(--glass-border);">
                    <label style="font-size: 0.8rem; color: var(--text-dim); margin: 0;">Gabungkan data per hari?</label>
                    <input type="checkbox" id="group-toggle" onchange="filterLogs()" style="width: 20px; height: 20px; cursor: pointer;">
                </div>
            </div>

            <div id="print-area">
                <table>
                    <thead>
                        <tr style="background: rgba(255,255,255,0.02);">
                            <th>Hari & Tanggal</th>
                            <th>Nama Barang</th>
                            <th>Tipe</th>
                            <th>Qty</th>
                            <th>Keterangan / Alasan</th>
                            <th>Admin</th>
                            <th class="no-print" style="text-align: right;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="log-body">
                        <!-- Logs injected here -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        if (localStorage.getItem('auth_role') !== 'admin' && localStorage.getItem('auth_role') !== 'engineer') {
            window.location.href = 'index.html';
        }

        let allLogs = [];

        async function loadLogs() {
            const logs = await fetchData('/stock-logs');
            allLogs = logs;
            populateCategories(logs);
            updateStats(logs);
            renderLogs(logs);
        }

        function populateCategories(logs) {
            const dropdown = document.getElementById('filter-category');
            if (!dropdown) return;
            const categories = [...new Set(logs.map(l => l.itemCategory).filter(Boolean))];
            
            const currentVal = dropdown.value;
            dropdown.innerHTML = '<option value="all" style="color: black;">SEMUA KATEGORI</option>';
            categories.sort().forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat.toUpperCase();
                opt.style.color = 'black';
                dropdown.appendChild(opt);
            });
            dropdown.value = currentVal;
        }

        async function deleteLog(id) {
            if (confirm('Apakah Anda yakin ingin menghapus catatan riwayat stok ini?')) {
                const res = await deleteData(`/stock-logs/${id}`);
                if (res && res.success) {
                    allLogs = []; // Force refresh
                    loadLogs();
                }
            }
        }

        async function resetAllStockLogs() {
            if (confirm('!!! PERINGATAN KERAS !!!\n\nIni akan MENGHAPUS SELURUH RIWAYAT PERGERAKAN STOK secara permanen!\nData yang sudah dihapus tidak bisa dikembalikan.\n\nApakah Anda benar-benar yakin?')) {
                if (confirm('Konfirmasi Terakhir: Hapus SEMUA riwayat stok sekarang?')) {
                    const res = await fetch(`/api/stock-logs/reset-all`, { method: 'DELETE' });
                    const result = await res.json();
                    if (result.success) {
                        alert(`BERHASIL: Seluruh ${result.deletedCount} riwayat stok telah dimusnahkan.`);
                        allLogs = []; // Force refresh
                        loadLogs();
                    }
                }
            }
        }

        function updateStats(logs) {
            const totalIn = logs.filter(l => l.type === 'in').reduce((acc, l) => acc + (l.delta || 0), 0);
            const totalOut = logs.filter(l => l.type === 'out').reduce((acc, l) => acc + (l.delta || 0), 0);
            
            document.getElementById('stat-in').textContent = totalIn;
            document.getElementById('stat-out').textContent = totalOut;
            document.getElementById('stat-count').textContent = logs.length;
        }

        function renderLogs(logs) {
            const body = document.getElementById('log-body');
            const isGrouped = document.getElementById('group-toggle').checked;
            body.innerHTML = '';

            if (logs.length === 0) {
                body.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 5rem; color: var(--text-dim);">Belum ada riwayat stok.</td></tr>';
                return;
            }

            let displayLogs = logs;

            if (isGrouped) {
                const groups = {};
                logs.forEach(log => {
                    const dateStr = new Date(log.timestamp).toLocaleDateString('id-ID');
                    const key = `${log.itemName}_${dateStr}`;
                    if (!groups[key]) {
                        groups[key] = {
                            ...log,
                            deltaIn: 0,
                            deltaOut: 0,
                            isGroup: true,
                            dateStr: dateStr,
                            count: 0
                        };
                    }
                    if (log.type === 'in') groups[key].deltaIn += log.delta;
                    else groups[key].deltaOut += log.delta;
                    groups[key].count++;
                });
                displayLogs = Object.values(groups).sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
            } else {
                displayLogs = logs.sort((a,b) => b.id - a.id);
            }

            displayLogs.forEach(log => {
                const row = document.createElement('tr');
                const date = new Date(log.timestamp);
                
                if (log.isGroup) {
                    row.innerHTML = `
                        <td data-label="Hari & Tanggal" style="white-space: nowrap;">
                            <strong>${log.dateStr}</strong><br>
                            <small style="color: var(--primary-color)">Rekap Harian</small>
                        </td>
                        <td data-label="Nama Barang"><strong style="color: var(--primary-color)">${log.itemName}</strong></td>
                        <td data-label="Tipe">
                            ${log.deltaIn > 0 ? `<span class="badge badge-in" style="margin-bottom:2px; display:inline-block;">MASUK (+${log.deltaIn})</span><br>` : ''}
                            ${log.deltaOut > 0 ? `<span class="badge badge-out">KELUAR (-${log.deltaOut})</span>` : ''}
                        </td>
                        <td data-label="Qty">
                            <strong style="font-size: 1rem;">${log.deltaIn - log.deltaOut >= 0 ? '+' : ''}${log.deltaIn - log.deltaOut}</strong>
                        </td>
                        <td data-label="Keterangan"><span style="font-size: 0.85rem; color: var(--text-dim);">Hasil gabungan ${log.count} transaksi</span></td>
                        <td data-label="Admin"><span style="background: rgba(255,255,255,0.05); padding: 2px 8px; border-radius: 4px; font-size: 0.8rem;">Multi-Admin</span></td>
                        <td class="no-print" style="text-align: right; color: var(--text-dim); font-size: 0.7rem;">(Grouped)</td>
                    `;
                } else {
                    row.innerHTML = `
                        <td data-label="Hari & Tanggal" style="white-space: nowrap;">
                            <small style="color: var(--text-dim);">${date.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short' })}</small><br>
                            <strong>${date.toLocaleTimeString('id-ID')}</strong>
                        </td>
                        <td data-label="Nama Barang"><strong style="color: var(--primary-color)">${log.itemName}</strong></td>
                        <td data-label="Tipe"><span class="badge ${log.type === 'in' ? 'badge-in' : 'badge-out'}" style="padding: 2px 8px; font-size: 0.65rem;">${log.type === 'in' ? 'MASUK' : 'KELUAR'}</span></td>
                        <td data-label="Qty"><strong style="font-size: 1rem; color: ${log.type === 'in' ? 'var(--primary-color)' : '#ff4757'}">${log.type === 'in' ? '+' : '-'}${log.delta}</strong></td>
                        <td data-label="Keterangan"><span style="font-size: 0.85rem; color: var(--text-dim);">${log.reason}</span></td>
                        <td data-label="Admin"><span style="background: rgba(255,255,255,0.05); padding: 2px 8px; border-radius: 4px; font-size: 0.8rem;">${log.user || 'System'}</span></td>
                        <td data-label="Aksi" class="no-print" style="text-align: right;">
                            <button class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.75rem; color: var(--danger); border-color: rgba(231, 76, 60, 0.2);" onclick="deleteLog(${log.id})">Hapus</button>
                        </td>
                    `;
                }
                body.appendChild(row);
            });
        }

        function filterLogs() {
            const searchTerm = document.getElementById('search-item').value.toLowerCase();
            const typeFilter = document.getElementById('filter-type').value;
            const catFilter = document.getElementById('filter-category').value;

            const filtered = allLogs.filter(log => {
                const matchesSearch = log.itemName.toLowerCase().includes(searchTerm);
                const matchesType = typeFilter === 'all' || log.type === typeFilter;
                const matchesCategory = catFilter === 'all' || log.itemCategory === catFilter;
                return matchesSearch && matchesType && matchesCategory;
            });

            updateStats(filtered);
            renderLogs(filtered);
        }

        function printStockReport() {
            const table = document.querySelector('table').cloneNode(true);
            const printWin = window.open('', '_blank');
            
            const html = `
                <html>
                <head>
                    <title>Laporan Stok Barang</title>
                    <style>
                        body { font-family: sans-serif; padding: 40px; color: black; background: white !important; line-height: 1.6; }
                        .header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #000; padding-bottom: 20px; }
                        .header h1 { margin: 0; font-size: 24px; color: black !important; }
                        table { width: 100%; border-collapse: collapse; margin-top: 20px; border: 1px solid black !important; }
                        th, td { border: 1px solid black !important; padding: 10px; text-align: left; font-size: 11px; color: black !important; background: transparent !important; }
                        th { background-color: #f0f0f0 !important; text-transform: uppercase; }
                        .footer { margin-top: 50px; display: flex; justify-content: space-between; color: black !important; }
                        .sig-box { width: 200px; text-align: center; }
                        .sig-space { height: 60px; border-bottom: 1px solid #000; margin-bottom: 10px; }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <h1>OM BEN BILLIARD X V3 KARAOKE</h1>
                        <p>Jl. Raya Utama No. 123, Kota Billiard</p>
                        <h3>LAPORAN MUTASI STOK BARANG</h3>
                    </div>
                    <div style="display:flex; justify-content:space-between; margin-bottom: 10px; color: black !important;">
                        <span>Periode: <strong>Semua Waktu</strong></span>
                        <span>Dicetak: <strong>${new Date().toLocaleString('id-ID')}</strong></span>
                    </div>
                    ${table.outerHTML}
                    <div class="footer">
                        <div class="sig-box">
                            <p>Admin Gudang</p>
                            <div class="sig-space"></div>
                            <p>( ________________ )</p>
                        </div>
                        <div class="sig-box">
                            <p>Mengetahui,</p>
                            <div class="sig-space"></div>
                            <p>( <strong>OM BEN</strong> )</p>
                        </div>
                    </div>
                    <script>
                        window.onload = function() { window.print(); setTimeout(() => window.close(), 500); }
                    <\/script>
                </body>
                </html>`;
            printWin.document.write(html);
            printWin.document.close();
        }

        setInterval(loadLogs, 30000);
        loadLogs();
    </script>
</body>
</html>
