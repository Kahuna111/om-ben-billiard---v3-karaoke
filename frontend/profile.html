<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil Saya | Om Ben Billiard</title>
    <link rel="stylesheet" href="assets/style.css" />
    <style>
      .profile-container {
        max-width: 500px;
        margin: 0 auto;
        background: var(--card-bg);
        backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        padding: 3rem;
        border-radius: 28px;
      }
      .profile-header {
        text-align: center;
        margin-bottom: 2.5rem;
      }
      .profile-header h2 {
        font-family: var(--font-heading);
        font-size: 2rem;
        margin-bottom: 0.5rem;
      }
      .profile-header p {
        color: var(--text-dim);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="logo-section">
          <img src="assets/Logo Baru.jpeg" alt="Logo" class="main-logo" />
          <div>
            <h1>OM BEN BILLIARD</h1>
            <p>X V3 KARAOKE User Profile</p>
          </div>
        </div>
        <nav></nav>
      </header>

      <script src="assets/app.js"></script>
      <script>
        renderNavbar("profile");
      </script>

      <div class="profile-container">
        <div class="profile-header">
          <div
            style="
              position: relative;
              width: 120px;
              height: 120px;
              margin: 0 auto 1.5rem;
            "
          >
            <img
              id="profile-preview"
              src="assets/Logo Baru.jpeg"
              alt="Profile"
              style="
                width: 100%;
                height: 100%;
                border-radius: 50%;
                object-fit: cover;
                border: 3px solid var(--primary-color);
                padding: 5px;
                background: rgba(255, 255, 255, 0.05);
              "
            />
            <label
              for="photo-upload"
              style="
                position: absolute;
                bottom: 5px;
                right: 5px;
                background: var(--primary-color);
                width: 32px;
                height: 32px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
              "
            >
              <span style="font-size: 1.2rem; color: #1a1a2e">📷</span>
            </label>
            <input type="file" id="photo-upload" hidden accept="image/*" />
          </div>
          <h2>Pengaturan Profil</h2>
          <p>Kelola foto, username, dan password Anda</p>
        </div>

        <form id="profile-form">
          <div class="form-group">
            <label>Username Baru</label>
            <input
              type="text"
              id="new-username"
              placeholder="Masukkan username baru"
              required
            />
          </div>
          <div class="form-group" id="password-group">
            <label>Password Baru</label>
            <input
              type="password"
              id="new-password"
              placeholder="Biarkan kosong jika tidak ingin ganti"
            />
            <p
              id="pwd-notice"
              style="
                font-size: 0.75rem;
                color: var(--danger);
                margin-top: 0.5rem;
                display: none;
              "
            >
              * Hanya Admin yang dapat mengganti password.
            </p>
          </div>
          <div class="form-group" style="margin-top: 2rem">
            <button type="submit" class="btn btn-primary" id="save-btn">
              Simpan Perubahan
            </button>
          </div>
          <div
            id="status-message"
            style="text-align: center; margin-top: 1rem; font-size: 0.9rem"
          ></div>
        </form>
      </div>
    </div>

    <script>
      const oldUser = localStorage.getItem("auth_user");
      const role = localStorage.getItem("auth_role");
      document.getElementById("new-username").value = oldUser;

      // Restriction: Only admin or engineer can change username/password
      if (role !== "admin" && role !== "engineer") {
        const pwdInput = document.getElementById("new-password");
        pwdInput.disabled = true;
        pwdInput.style.opacity = "0.5";
        pwdInput.placeholder = "Dikunci (Hubungi Admin)";
        document.getElementById("pwd-notice").style.display = "block";

        const userInput = document.getElementById("new-username");
        userInput.disabled = true;
        userInput.style.opacity = "0.5";
        userInput.placeholder = "Dikunci (Hubungi Admin)";

        const userNotice = document.createElement("p");
        userNotice.style.fontSize = "0.75rem";
        userNotice.style.color = "var(--danger)";
        userNotice.style.marginTop = "0.5rem";
        userNotice.textContent =
          "* Hanya Admin/Engineer yang dapat mengganti username.";
        userInput.parentNode.appendChild(userNotice);
      }

      let base64Photo = null;

      // Load existing photo if any
      async function loadCurrentProfile() {
        const users = await fetchData("/users");
        const current = users.find((u) => u.username === oldUser);
        if (current && current.profilePic) {
          document.getElementById("profile-preview").src = current.profilePic;
          base64Photo = current.profilePic;
        }
      }
      loadCurrentProfile();

      // Photo Upload Handling
      document.getElementById("photo-upload").onchange = function (e) {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function (event) {
            const imgUrl = event.target.result;
            document.getElementById("profile-preview").src = imgUrl;
            base64Photo = imgUrl; // Base64 string
          };
          reader.readAsDataURL(file);
        }
      };

      document.getElementById("profile-form").onsubmit = async (e) => {
        e.preventDefault();
        const saveBtn = document.getElementById("save-btn");
        const statusEl = document.getElementById("status-message");

        const newUsername = document.getElementById("new-username").value;
        const newPassword = document.getElementById("new-password").value;

        saveBtn.disabled = true;
        saveBtn.textContent = "Menyimpan...";

        try {
          const res = await putData("/users/update", {
            oldUsername: oldUser,
            newUsername: newUsername,
            newPassword: newPassword,
            profilePic: base64Photo,
            // role used by backend authorization (admin/engineer)
            role,
          });

          if (res && res.success) {
            // Update the "ID Card" in the browser immediately
            localStorage.setItem("auth_user", res.username);
            if (res.profilePic)
              localStorage.setItem("auth_profile_pic", res.profilePic);

            // Update navbar immediately before reload for smooth feel
            renderNavbar("profile");

            statusEl.style.color = "var(--primary-color)";
            statusEl.textContent = "Berhasil! Username & Profil diperbarui.";

            setTimeout(() => {
              window.location.reload();
            }, 1000);
          } else {
            const msg = res ? res.message : "Gagal menyimpan.";
            statusEl.style.color = "var(--danger)";
            statusEl.textContent = msg;
            alert(msg);
            saveBtn.disabled = false;
            saveBtn.textContent = "Simpan Perubahan";
          }
        } catch (err) {
          statusEl.style.color = "var(--danger)";
          statusEl.textContent = "Gagal terhubung ke server.";
          saveBtn.disabled = false;
          saveBtn.textContent = "Simpan Perubahan";
        }
      };
    </script>
  </body>
</html>
