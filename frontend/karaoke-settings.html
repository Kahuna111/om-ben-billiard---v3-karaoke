<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan Karaoke | Om Ben Billiard</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-section">
                <img src="assets/Logo Baru.jpeg" alt="Logo" class="main-logo">
                <div>
                    <h1>OM BEN BILLIARD</h1>
                    <p>X V3 KARAOKE Settings</p>
                </div>
            </div>
            <nav></nav>
        </header>

        <script src="assets/app.js"></script>
        <script>renderNavbar('karaoke-settings');</script>

        <section>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h2 style="font-family: var(--font-heading); margin: 0;">Pengaturan Ruang Karaoke</h2>
                <button class="btn btn-primary" style="width: auto;" onclick="openAddModal()">+ Tambah Ruangan</button>
            </div>
            <div class="table-grid" id="settings-container">
                <!-- Editable cards injected here -->
            </div>
        </section>
    </div>

    <!-- Edit/Add Modal -->
    <div class="modal" id="edit-modal">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-bottom: 1.5rem; font-family: var(--font-heading);">Ubah Data Ruangan</h2>
            <form id="edit-form">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label>Nama Ruangan</label>
                    <input type="text" id="edit-name" placeholder="Contoh: Ruang Small" required>
                </div>
                <div class="form-group">
                    <label>Tarif Per Jam (Rp)</label>
                    <input type="number" id="edit-rate" placeholder="50000" required>
                </div>
                <div class="form-group">
                    <label>Fasilitas/Kapasitas</label>
                    <input type="text" id="edit-desc" placeholder="Contoh: Kapasitas 4 Orang">
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="btn btn-outline" id="close-edit">Batal</button>
                    <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        if (localStorage.getItem('auth_role') !== 'admin' && localStorage.getItem('auth_role') !== 'engineer') {
            alert('Akses Ditolak! Halaman ini khusus Admin / Engineer.');
            window.location.href = 'index.html';
        }

        let isEditMode = false;

        async function loadRooms() {
            const rooms = await fetchData('/rooms');
            const container = document.getElementById('settings-container');
            container.innerHTML = '';

            rooms.forEach(room => {
                const card = document.createElement('div');
                card.className = 'table-card';
                card.innerHTML = `
                    <div class="table-header">
                        <div class="table-info">
                            <h2>${room.name}</h2>
                            <div class="rate">${formatRupiah(room.hourlyRate)} / jam</div>
                        </div>
                    </div>
                    <div style="color: var(--text-dim); margin-bottom: 1.5rem;">
                        Info: ${room.description}
                    </div>
                    <div style="display: flex; gap: 0.5rem;">
                        <button class="btn btn-outline" onclick="openEditModal(${JSON.stringify(room).replace(/"/g, '&quot;')})">Edit</button>
                        <button class="btn btn-outline" style="color: var(--danger); border-color: rgba(231, 76, 60, 0.2);" onclick="deleteRoom(${room.id})">Hapus</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openAddModal() {
            isEditMode = false;
            document.getElementById('modal-title').textContent = 'Tambah Ruangan Baru';
            document.getElementById('edit-id').value = '';
            document.getElementById('edit-name').value = '';
            document.getElementById('edit-rate').value = 50000;
            document.getElementById('edit-desc').value = '';
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function openEditModal(room) {
            isEditMode = true;
            document.getElementById('modal-title').textContent = 'Ubah Data Ruangan';
            document.getElementById('edit-id').value = room.id;
            document.getElementById('edit-name').value = room.name;
            document.getElementById('edit-rate').value = room.hourlyRate;
            document.getElementById('edit-desc').value = room.description;
            document.getElementById('edit-modal').style.display = 'flex';
        }

        async function deleteRoom(id) {
            if (confirm('Apakah Anda yakin ingin menghapus ruangan ini?')) {
                const res = await fetch(`/api/rooms/${id}`, { method: 'DELETE' });
                if (res.ok) loadRooms();
                else {
                    const err = await res.json();
                    alert(err.message);
                }
            }
        }

        document.getElementById('close-edit').onclick = () => document.getElementById('edit-modal').style.display = 'none';

        document.getElementById('edit-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const data = {
                name: document.getElementById('edit-name').value,
                hourlyRate: parseInt(document.getElementById('edit-rate').value),
                description: document.getElementById('edit-desc').value
            };

            const url = isEditMode ? `/api/rooms/${id}` : `/api/rooms`;
            const method = isEditMode ? 'PUT' : 'POST';

            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                document.getElementById('edit-modal').style.display = 'none';
                loadRooms();
            }
        };

        loadRooms();
    </script>
</body>
</html>
