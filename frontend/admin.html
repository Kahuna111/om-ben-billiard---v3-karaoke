<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Om Ben Billiard</title>
    <link rel="stylesheet" href="assets/style.css" />
    <style>
      .category-tab-btn {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--glass-border);
        color: var(--text-dim);
        padding: 0.6rem 1.2rem;
        border-radius: 12px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        white-space: nowrap;
        display: inline-block;
        font-family: var(--font-body);
      }
      .category-tab-btn:hover {
        color: var(--text-light);
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.2);
        transform: translateY(-2px);
      }
      .category-tab-btn.active {
        background: var(--primary-color);
        color: var(--bg-dark);
        font-weight: 700;
        border-color: var(--primary-color);
        box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        transform: translateY(-2px);
      }
      @media (max-width: 768px) {
        .admin-header-flex {
          flex-direction: column;
          align-items: stretch !important;
          gap: 1rem;
        }
        .admin-header-flex .btn {
          width: 100% !important;
        }
        .admin-table-container th:nth-child(1),
        .admin-table-container td:nth-child(1) {
          display: none;
        }

        /* Beautiful dynamic category header rows on mobile (shows up instead of being hidden) */
        .admin-table-container tbody tr.category-header-row {
          display: block !important;
          background: transparent !important;
          border: none !important;
          margin-top: 1.5rem !important;
          margin-bottom: 0.5rem !important;
          padding: 0 !important;
          box-shadow: none !important;
        }
        .admin-table-container tbody tr.category-header-row td {
          display: block !important; /* Overrides the display: none of td:nth-child(1) */
          background: transparent !important;
          padding: 0.5rem 0.2rem !important;
          color: var(--primary-color) !important;
          font-size: 0.85rem !important;
          font-weight: 800 !important;
          letter-spacing: 1px !important;
          border: none !important;
          text-align: left !important;
        }
        .admin-table-container tbody tr.category-header-row td::before {
          content: none !important; /* Hide data-label on mobile */
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="logo-section">
          <img src="assets/logo.png" alt="Logo" class="main-logo" />
          <div>
            <h1>OM BEN BILLIARD</h1>
            <p>X V3 KARAOKE Admin</p>
          </div>
        </div>
        <nav></nav>
      </header>

      <script src="assets/app.js"></script>
      <script>
        renderNavbar("admin");
      </script>

      <section>
        <div
          class="admin-header-flex"
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
          "
        >
          <h2 style="font-family: var(--font-heading); margin: 0">
            Manajemen Menu F&B
          </h2>
          <div
            style="
              display: flex;
              gap: 0.5rem;
              align-items: center;
              flex-wrap: wrap;
            "
          >
            <input
              type="text"
              id="search-admin-menu"
              placeholder="Cari menu..."
              oninput="loadMenu()"
              style="
                background: rgba(255, 255, 255, 0.05);
                border-radius: 10px;
                padding: 0.6rem 1rem;
                color: white;
                border: 1px solid var(--glass-border);
                min-width: 150px;
              "
            />
            <button
              class="btn btn-primary"
              style="width: auto"
              onclick="openMenuModal()"
            >
              + Tambah
            </button>
          </div>
        </div>

        <div
          style="
            background: var(--card-bg);
            border-radius: 20px;
            overflow-x: auto;
            border: 1px solid var(--glass-border);
          "
        >
          <table
            class="admin-table-container"
            style="width: 100%; border-collapse: collapse; text-align: left"
          >
            <thead>
              <tr>
                <th
                  style="
                    padding: 1rem;
                    background: rgba(255, 255, 255, 0.05);
                    color: var(--text-dim);
                  "
                >
                  Kategori
                </th>
                <th
                  style="
                    padding: 1rem;
                    background: rgba(255, 255, 255, 0.05);
                    color: var(--text-dim);
                  "
                >
                  Nama Menu
                </th>
                <th
                  style="
                    padding: 1rem;
                    background: rgba(255, 255, 255, 0.05);
                    color: var(--text-dim);
                  "
                >
                  Harga
                </th>
                <th
                  style="
                    padding: 1rem;
                    background: rgba(255, 255, 255, 0.05);
                    color: var(--text-dim);
                    text-align: center;
                  "
                >
                  Stok
                </th>
                <th
                  style="
                    padding: 1rem;
                    background: rgba(255, 255, 255, 0.05);
                    color: var(--text-dim);
                    text-align: right;
                  "
                >
                  Aksi
                </th>
              </tr>
            </thead>
            <tbody id="menu-list">
              <!-- Menu items will be injected here -->
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <!-- Add/Edit Menu Modal -->
    <div class="modal" id="menu-modal">
      <div class="modal-content">
        <h2
          id="modal-title"
          style="margin-bottom: 1.5rem; font-family: var(--font-heading)"
        >
          Tambah Menu F&B
        </h2>
        <form id="menu-form">
          <input type="hidden" id="menu-id" />
          <div class="form-group">
            <label>Kategori</label>
            <input
              type="text"
              id="menu-category"
              list="category-options"
              required
              placeholder="Pilih atau ketik kategori baru"
            />
            <datalist id="category-options"></datalist>
          </div>
          <div class="form-group">
            <label>Nama Makanan/Minuman</label>
            <input
              type="text"
              id="menu-name"
              required
              placeholder="Contoh: Es Teh Manis"
            />
          </div>
          <div class="form-group">
            <label>Harga (Rp)</label>
            <input type="number" id="menu-price" required placeholder="5000" />
          </div>
          <div class="form-group" id="stock-group">
            <label id="stock-label">Stok Awal</label>
            <input
              type="number"
              id="menu-stock"
              required
              placeholder="100"
              value="0"
            />
          </div>
          <div style="display: flex; gap: 1rem; margin-top: 2rem">
            <button
              type="button"
              class="btn btn-outline"
              onclick="
                document.getElementById('menu-modal').style.display = 'none'
              "
            >
              Batal
            </button>
            <button type="submit" class="btn btn-primary">Simpan Menu</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const roleNow = localStorage.getItem("auth_role");
      if (roleNow !== "admin" && roleNow !== "engineer") {
        window.location.href = "index.html";
      }

      let activeCategory = "Semua";

      async function loadMenu() {
        const menu = await fetchData("/menu");
        const categories = [...new Set(menu.map((item) => item.category))];

        const datalist = document.getElementById("category-options");
        datalist.innerHTML = "";
        categories.forEach((c) => {
          const opt = document.createElement("option");
          opt.value = c;
          datalist.appendChild(opt);
        });

        // Render category tabs dynamically
        const tabsContainer = document.getElementById("category-tabs");
        if (tabsContainer) {
          tabsContainer.innerHTML = "";
          const allCategories = ["Semua", ...categories];

          // If active category was deleted or is no longer present, fallback to 'Semua'
          if (!allCategories.includes(activeCategory)) {
            activeCategory = "Semua";
          }

          allCategories.forEach((cat) => {
            const btn = document.createElement("button");
            btn.className = `category-tab-btn ${activeCategory === cat ? "active" : ""}`;
            btn.textContent = cat.toUpperCase();
            btn.onclick = () => {
              activeCategory = cat;
              loadMenu();
            };
            tabsContainer.appendChild(btn);
          });
        }

        const searchQuery = document
          .getElementById("search-admin-menu")
          .value.toLowerCase();
        const filtered = menu.filter((item) => {
          const matchesSearch = item.name.toLowerCase().includes(searchQuery);
          const matchesCategory =
            activeCategory === "Semua" || item.category === activeCategory;
          return matchesSearch && matchesCategory;
        });

        const tbody = document.getElementById("menu-list");
        tbody.innerHTML = "";

        if (filtered.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="5" style="text-align:center; padding:2rem; color: var(--text-dim);">Menu tidak ditemukan</td></tr>';
          return;
        }

        const grouped = filtered.reduce((acc, item) => {
          if (!acc[item.category]) acc[item.category] = [];
          acc[item.category].push(item);
          return acc;
        }, {});

        for (const category in grouped) {
          const headerRow = document.createElement("tr");
          headerRow.className = "category-header-row";
          headerRow.innerHTML = `
                    <td colspan="5" style="padding: 0.8rem 1rem; background: rgba(0, 243, 255, 0.05); font-weight: bold; color: var(--primary-color); font-size: 0.8rem; border-radius: 8px;">
                        ${category.toUpperCase()}
                    </td>
                `;
          tbody.appendChild(headerRow);

          grouped[category].forEach((item) => {
            const row = document.createElement("tr");
            row.style.borderBottom = "1px solid var(--glass-border)";
            row.innerHTML = `
                        <td style="padding: 1rem; color: var(--text-dim);" data-label="Kategori">${item.category}</td>
                        <td style="padding: 1rem; font-weight: 600;" data-label="Nama Menu">${item.name}</td>
                        <td style="padding: 1rem; color: var(--accent-gold);" data-label="Harga">${formatRupiah(item.price)}</td>
                        <td style="padding: 1rem; text-align: center;" data-label="Stok">
                            <div style="display: flex; align-items: center; gap: 0.5rem; justify-content: center;">
                                <button class="btn btn-outline" style="width: 28px; height: 28px; padding: 0;" onclick="adjustStock(${item.id}, -1)">-</button>
                                <input type="number" value="${item.stock || 0}" 
                                    style="width: 50px; background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); border-radius: 6px; color: white; text-align: center; font-weight: bold; padding: 2px;"
                                    onchange="updateStockDirect(${item.id}, this.value)"
                                >
                                <button class="btn btn-outline" style="width: 28px; height: 28px; padding: 0;" onclick="adjustStock(${item.id}, 1)">+</button>
                            </div>
                        </td>
                        <td style="padding: 1rem; text-align: right; white-space: nowrap;" data-label="Aksi">
                            <button class="btn btn-outline" style="width: auto; display: inline-block; padding: 0.4rem 0.8rem; font-size: 0.75rem; margin-right: 0.3rem;" onclick="openEditModal(${JSON.stringify(item).replace(/"/g, "&quot;")})">Edit</button>
                            <button class="btn btn-outline" style="width: auto; display: inline-block; padding: 0.4rem 0.8rem; font-size: 0.75rem; color: var(--danger); border-color: rgba(231, 76, 60, 0.2);" onclick="deleteMenu(${item.id})">Hapus</button>
                        </td>
                    `;
            tbody.appendChild(row);
          });
        }
      }

      async function updateStockDirect(id, value) {
        const res = await postData(`/menu/${id}/set-stock`, {
          stock: parseInt(value),
          reason: "Admin Direct Input",
          user: localStorage.getItem("auth_user"),
        });
        if (res) loadMenu();
      }

      async function adjustStock(id, delta) {
        const res = await postData(`/menu/${id}/adjust-stock`, {
          delta,
          reason: "Admin Adjustment",
          user: localStorage.getItem("auth_user"),
        });
        if (res) loadMenu();
      }

      let isEditMode = false;

      function openMenuModal() {
        isEditMode = false;
        document.getElementById("menu-form").reset();
        document.getElementById("modal-title").textContent = "Tambah Menu F&B";
        document.getElementById("menu-id").value = "";
        document.getElementById("stock-label").textContent = "Stok Awal";
        document.getElementById("menu-stock").required = true;
        document.getElementById("menu-modal").style.display = "flex";
      }

      function openEditModal(item) {
        isEditMode = true;
        document.getElementById("modal-title").textContent = "Ubah Detail Menu";
        document.getElementById("menu-id").value = item.id;
        document.getElementById("menu-category").value = item.category;
        document.getElementById("menu-name").value = item.name;
        document.getElementById("menu-price").value = item.price;
        document.getElementById("stock-label").textContent = "Jumlah Stok";
        document.getElementById("menu-stock").value = item.stock || 0;
        document.getElementById("menu-stock").required = true;
        document.getElementById("menu-modal").style.display = "flex";
      }

      document.getElementById("menu-form").onsubmit = async (e) => {
        e.preventDefault();
        const id = document.getElementById("menu-id").value;
        const data = {
          category: document.getElementById("menu-category").value,
          name: document.getElementById("menu-name").value,
          price: parseInt(document.getElementById("menu-price").value),
          stock: parseInt(document.getElementById("menu-stock").value) || 0,
        };

        let res;
        if (isEditMode) {
          res = await putData(`/menu/${id}`, data);
        } else {
          res = await postData(
            `/menu?user=${localStorage.getItem("auth_user")}`,
            data,
          );
        }

        if (res) {
          document.getElementById("menu-modal").style.display = "none";
          loadMenu();
        }
      };

      async function deleteMenu(id) {
        if (confirm("Hapus menu ini?")) {
          const res = await deleteData(`/menu/${id}`);
          if (res && res.success) {
            loadMenu();
          } else {
            alert("Gagal menghapus menu. Silakan coba lagi.");
          }
        }
      }

      // Auto Refresh Admin Menu every 30s
setInterval(loadMenu, 30000);
loadMenu();

// Load today's attendance
async function loadAttendance() {
  const now = typeof getSyncedNow === 'function' ? getSyncedNow() : new Date();
  const today = now.toISOString().split('T')[0];
  try {
    const res = await fetch(`/api/attendance?date=${today}`);
    if (!res.ok) throw new Error('Failed to fetch attendance');
    const data = await res.json();
    const tbody = document.getElementById('attendance-body');
    tbody.innerHTML = '';
    if (data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="3" style="padding:1rem; text-align:center; color:var(--text-dim);">Tidak ada kehadiran hari ini</td></tr>`;
      return;
    }
    data.forEach(item => {
      const inTime = new Date(item.clockIn).toLocaleTimeString('id-ID');
      const outTime = item.clockOut ? new Date(item.clockOut).toLocaleTimeString('id-ID') : '-';
      tbody.innerHTML += `
        <tr>
          <td style="padding:1rem; color:var(--text-dim);" data-label="Nama">${item.employeeName}</td>
          <td style="padding:1rem; color:var(--text-dim);" data-label="Masuk">${inTime}</td>
          <td style="padding:1rem; color:var(--text-dim);" data-label="Keluar">${outTime}</td>
        </tr>`;
    });
  } catch (e) {
    console.error('Attendance load error', e);
    const tbody = document.getElementById('attendance-body');
    tbody.innerHTML = `<tr><td colspan="3" style="padding:1rem; text-align:center; color:red;">Error memuat data</td></tr>`;
  }
}

      setInterval(loadMenu, 30000);
      loadMenu();
    </script>
  </body>
</html>
