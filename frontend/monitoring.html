<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Monitoring | Admin Om Ben</title>
    <link rel="stylesheet" href="assets/style.css">
    <style>
        .monitor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        .active-card {
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.3);
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0% { border-color: rgba(0, 243, 255, 0.3); }
            50% { border-color: rgba(0, 243, 255, 0.8); }
            100% { border-color: rgba(0, 243, 255, 0.3); }
        }
        @keyframes pulse-pink-border {
            0% { border-color: rgba(236, 0, 140, 0.3); }
            50% { border-color: rgba(236, 0, 140, 0.8); }
            100% { border-color: rgba(236, 0, 140, 0.3); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-section">
                <img src="assets/logo.png" alt="Logo" class="main-logo">
                <div>
                    <h1>OM BEN BILLIARD</h1>
                    <p>X V3 KARAOKE Live Monitor</p>
                </div>
            </div>
            <nav></nav>
        </header>

        <script src="assets/app.js"></script>
        <script>renderNavbar('monitoring');</script>

        <section>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h2 style="font-family: var(--font-heading); margin: 0;">Status Ketersediaan Meja & Ruangan</h2>
                <div style="font-size: 0.9rem; color: var(--text-dim);">Auto Refresh: <span id="refresh-timer">1</span>s</div>
            </div>

            <div class="monitor-grid" id="monitor-container">
                <!-- All tables and rooms injected here dynamically -->
            </div>
        </section>
    </div>

    <script>
        if (localStorage.getItem('auth_role') !== 'admin' && localStorage.getItem('auth_role') !== 'engineer') {
            window.location.href = 'index.html';
        }

        async function updateMonitor() {
            try {
                const sessions = await fetchData('/sessions');
                const tables = await fetchData('/tables');
                const rooms = await fetchData('/rooms');
                const bookings = await fetchData('/bookings');
                
                // Get today's local YYYY-MM-DD date string
                const now = (typeof getSyncedNow === 'function') ? getSyncedNow() : new Date();
                const yyyy = now.getFullYear();
                const mm = String(now.getMonth() + 1).padStart(2, '0');
                const dd = String(now.getDate()).padStart(2, '0');
                const todayStr = `${yyyy}-${mm}-${dd}`;
                
                const container = document.getElementById('monitor-container');
                container.innerHTML = '';

                // --- 1. BILLIARD TABLES SECTION ---
                const billiardHeader = document.createElement('div');
                billiardHeader.style.cssText = 'grid-column: 1/-1; margin-top: 1rem; border-bottom: 2px solid rgba(0, 243, 255, 0.1); padding-bottom: 0.5rem; margin-bottom: 1rem;';
                billiardHeader.innerHTML = `<h3 style="font-family: var(--font-heading); margin: 0; color: var(--primary-color); font-size: 1.2rem; letter-spacing: 1px;">🎱 AREA MEJA BILLIARD</h3>`;
                container.appendChild(billiardHeader);

                tables.forEach(table => {
                    const session = sessions.find(s => (s.targetType === 'table' || !s.targetType) && s.tableId == table.id);
                    const tableBooking = bookings.find(b => b.targetType === 'table' && b.targetId == table.id && b.bookingTime.startsWith(todayStr));
                    
                    const card = document.createElement('div');
                    
                    let statusClass = 'available';
                    let statusLabel = 'Tersedia';
                    let statusColor = '#2ecc71'; // Green (#2ecc71)
                    let timerHtml = '00:00:00';
                    let detailsHtml = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-dim); font-size: 0.8rem;">🟢 Meja Kosong / Siap digunakan</div>';
                    
                    if (session) {
                        statusClass = 'active-card';
                        statusLabel = 'Digunakan';
                        statusColor = 'var(--primary-color)'; // Cyan neon
                        const timer = session.type === 'duration' 
                            ? calculateCountdown(session.endTime)
                            : calculateTimeDiff(session.startTime);
                        timerHtml = timer.formatted;
                        detailsHtml = `
                            <div>
                                <div style="color: var(--text-dim); font-size: 0.75rem;">Pelanggan</div>
                                <div style="font-weight: bold; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${session.customerName}</div>
                            </div>
                            <div style="text-align: right;">
                                <div style="color: var(--text-dim); font-size: 0.75rem;">Mulai</div>
                                <div style="font-weight: bold; font-size: 0.85rem;">${formatTime(session.startTime)}</div>
                            </div>
                        `;
                    } else if (table.status === 'booked' || tableBooking) {
                        statusClass = 'booked-card';
                        statusLabel = 'Dipesan';
                        statusColor = 'var(--accent-gold)'; // Gold neon
                        timerHtml = 'RESERVED';
                        const bookTime = tableBooking ? formatTime(tableBooking.bookingTime) : 'Hari Ini';
                        const bookCust = tableBooking ? tableBooking.customerName : 'Pelanggan';
                        detailsHtml = `
                            <div style="grid-column: 1/-1; text-align: center;">
                                <div style="color: var(--text-dim); font-size: 0.75rem;">Booking untuk Jam: ${bookTime}</div>
                                <div style="font-weight: bold; color: var(--accent-gold);">${bookCust}</div>
                            </div>
                        `;
                    }

                    card.className = `table-card ${statusClass}`;
                    card.style.position = 'relative';
                    
                    if (statusClass === 'available') {
                        card.style.background = 'rgba(46, 204, 113, 0.03)';
                        card.style.borderColor = 'rgba(46, 204, 113, 0.2)';
                    } else if (statusClass === 'booked-card') {
                        card.style.background = 'rgba(241, 196, 15, 0.03)';
                        card.style.borderColor = 'rgba(241, 196, 15, 0.2)';
                    }

                    const isLightMode = document.body.classList.contains('light-mode');
                    const displayTimerColor = isLightMode ? '#000000' : (statusClass === 'available' ? '#ffffff' : statusColor);

                    card.innerHTML = `
                        <div class="table-header">
                            <div class="table-info">
                                <span style="font-size: 0.7rem; color: ${statusColor}; font-weight: bold; text-transform: uppercase;">Meja Billiard</span>
                                <h2>${table.name}</h2>
                                <div style="font-size: 0.75rem; color: var(--text-dim); margin-top: 2px;">• ${table.description || 'Standard'}</div>
                            </div>
                            <span class="status-badge" style="background: ${statusColor}; color: ${statusClass === 'available' ? '#ffffff' : 'var(--bg-dark)'}; font-weight: 800; font-size: 0.7rem;">${statusLabel}</span>
                        </div>
                        <div class="timer-display" style="color: ${displayTimerColor}; font-size: 2.8rem; margin: 1rem 0; font-family: monospace; font-weight: bold; text-align: center;">${timerHtml}</div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 1rem; font-size: 0.85rem; border-top: 1px dashed rgba(255,255,255,0.05); padding-top: 0.8rem;">
                            ${detailsHtml}
                        </div>
                    `;
                    container.appendChild(card);
                });

                // --- 2. KARAOKE ROOMS SECTION ---
                const karaokeHeader = document.createElement('div');
                karaokeHeader.style.cssText = 'grid-column: 1/-1; margin-top: 3rem; border-bottom: 2px solid rgba(236, 0, 140, 0.1); padding-bottom: 0.5rem; margin-bottom: 1rem;';
                karaokeHeader.innerHTML = `<h3 style="font-family: var(--font-heading); margin: 0; color: #ec008c; font-size: 1.2rem; letter-spacing: 1px;">🎤 ROOM KARAOKE V3</h3>`;
                container.appendChild(karaokeHeader);

                rooms.forEach(room => {
                    const session = sessions.find(s => s.targetType === 'room' && s.tableId == room.id);
                    const roomBooking = bookings.find(b => b.targetType === 'room' && b.targetId == room.id && b.bookingTime.startsWith(todayStr));
                    
                    const card = document.createElement('div');
                    
                    let statusClass = 'available';
                    let statusLabel = 'Tersedia';
                    let statusColor = '#2ecc71'; // Green (#2ecc71)
                    let timerHtml = '00:00:00';
                    let detailsHtml = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-dim); font-size: 0.8rem;">🟢 Ruangan Kosong / Siap digunakan</div>';
                    
                    if (session) {
                        statusClass = 'active-card';
                        statusLabel = 'Digunakan';
                        statusColor = '#ec008c'; // Hot pink neon
                        const timer = session.type === 'duration' 
                            ? calculateCountdown(session.endTime)
                            : calculateTimeDiff(session.startTime);
                        timerHtml = timer.formatted;
                        detailsHtml = `
                            <div>
                                <div style="color: var(--text-dim); font-size: 0.75rem;">Pelanggan</div>
                                <div style="font-weight: bold; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${session.customerName}</div>
                            </div>
                            <div style="text-align: right;">
                                <div style="color: var(--text-dim); font-size: 0.75rem;">Mulai</div>
                                <div style="font-weight: bold; font-size: 0.85rem;">${formatTime(session.startTime)}</div>
                            </div>
                        `;
                    } else if (room.status === 'booked' || roomBooking) {
                        statusClass = 'booked-card';
                        statusLabel = 'Dipesan';
                        statusColor = 'var(--accent-gold)'; // Gold neon
                        timerHtml = 'RESERVED';
                        const bookTime = roomBooking ? formatTime(roomBooking.bookingTime) : 'Hari Ini';
                        const bookCust = roomBooking ? roomBooking.customerName : 'Pelanggan';
                        detailsHtml = `
                            <div style="grid-column: 1/-1; text-align: center;">
                                <div style="color: var(--text-dim); font-size: 0.75rem;">Booking untuk Jam: ${bookTime}</div>
                                <div style="font-weight: bold; color: var(--accent-gold);">${bookCust}</div>
                            </div>
                        `;
                    }

                    card.className = `table-card ${statusClass}`;
                    card.style.position = 'relative';
                    
                    if (statusClass === 'available') {
                        card.style.background = 'rgba(46, 204, 113, 0.03)';
                        card.style.borderColor = 'rgba(46, 204, 113, 0.2)';
                    } else if (statusClass === 'booked-card') {
                        card.style.background = 'rgba(241, 196, 15, 0.03)';
                        card.style.borderColor = 'rgba(241, 196, 15, 0.2)';
                    } else if (statusClass === 'active-card') {
                        card.style.background = 'rgba(236, 0, 140, 0.05)';
                        card.style.borderColor = 'rgba(236, 0, 140, 0.3)';
                        card.style.animation = 'pulse-pink-border 2s infinite';
                    }

                    const isLightMode = document.body.classList.contains('light-mode');
                    const displayTimerColor = isLightMode ? '#000000' : (statusClass === 'available' ? '#ffffff' : statusColor);

                    card.innerHTML = `
                        <div class="table-header">
                            <div class="table-info">
                                <span style="font-size: 0.7rem; color: ${statusColor}; font-weight: bold; text-transform: uppercase;">Room Karaoke</span>
                                <h2>Ruang ${room.name}</h2>
                                <div style="font-size: 0.75rem; color: var(--text-dim); margin-top: 2px;">• ${room.description || 'Standard'}</div>
                            </div>
                            <span class="status-badge" style="background: ${statusColor}; color: ${statusClass === 'available' ? '#ffffff' : 'var(--bg-dark)'}; font-weight: 800; font-size: 0.7rem;">${statusLabel}</span>
                        </div>
                        <div class="timer-display" style="color: ${displayTimerColor}; font-size: 2.8rem; margin: 1rem 0; font-family: monospace; font-weight: bold; text-align: center;">${timerHtml}</div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 1rem; font-size: 0.85rem; border-top: 1px dashed rgba(255,255,255,0.05); padding-top: 0.8rem;">
                            ${detailsHtml}
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error("Monitor load error:", err);
            }
        }

        // Auto Refresh - Set countdown/polling interval to 1s
        let timeLeft = 1;
        setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                timeLeft = 1;
            }
            document.getElementById('refresh-timer').textContent = timeLeft;
            updateMonitor();
        }, 1000);

        updateMonitor();
    </script>
</body>
</html>
