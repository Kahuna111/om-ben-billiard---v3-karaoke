<!doctype html>
<html lang="en">
  <head>
    <script>
      // Force redirect from file:// to local server to avoid connection and storage sandbox issues
      if (window.location.protocol === 'file:') {
        const fileName = window.location.pathname.split('/').pop() || 'login.html';
        window.location.href = 'http://localhost:3001/' + fileName;
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Om Ben Billiard</title>
    <link rel="stylesheet" href="assets/style.css" />
    <style>
      .login-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .login-card {
        background: var(--card-bg);
        backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        padding: 3rem;
        border-radius: 24px;
        width: 100%;
        max-width: 400px;
        text-align: center;
      }
      .login-card h1 {
        font-family: var(--font-heading);
        font-size: 2.2rem;
        margin-bottom: 0.5rem;
        background: linear-gradient(to right, #fff, var(--primary-color));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .login-card p {
        color: var(--text-dim);
        margin-bottom: 2rem;
      }
      #login-error {
        color: var(--danger);
        margin-bottom: 1rem;
        font-size: 0.9rem;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-card">
        <img
          src="assets/Logo Baru.jpeg"
          alt="Logo"
          style="
            width: 80px;
            height: 80px;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.3));
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(0, 243, 255, 0.4);
          "
        />
        <h1>OM BEN BILLIARD</h1>
        <p>X V3 KARAOKE POS System</p>
        <div id="login-error">Username atau password salah!</div>
        <form id="login-form">
          <div class="form-group" style="text-align: left">
            <label>Username</label>
            <input type="text" id="username" required />
          </div>
          <div class="form-group" style="text-align: left">
            <label>Password</label>
            <div style="position: relative; display: flex; align-items: center;">
              <input type="password" id="password" required style="width: 100%; padding-right: 42px;" />
              <button type="button" id="toggle-password" style="
                position: absolute;
                right: 12px;
                background: none;
                border: none;
                color: var(--text-dim, rgba(255, 255, 255, 0.6));
                cursor: pointer;
                font-size: 1.1rem;
                padding: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                user-select: none;
                outline: none;
              " title="Tampilkan Password">👁️</button>
            </div>
          </div>
          <button
            type="submit"
            class="btn btn-primary"
            style="margin-top: 1rem"
          >
            MASUK KE SISTEM
          </button>
          <div style="margin-top: 1.5rem">
            <a
              href="#"
              onclick="
                alert(
                  'Silakan hubungi Owner atau Admin untuk mereset password Anda.',
                )
              "
              style="
                color: var(--text-dim);
                text-decoration: none;
                font-size: 0.85rem;
              "
              >Lupa Username / Password?</a
            >
          </div>
        </form>
      </div>
    </div>

    <script>
      // Redirect from file:// to localhost:3001 server
      if (window.location.protocol === 'file:') {
        const fileName = window.location.pathname.split('/').pop() || 'login.html';
        window.location.href = 'http://localhost:3001/' + fileName;
      }

      // Intercept global fetch to map relative /api calls to port 3001 if on other port or file://
      (function interceptFetch() {
        if (window.fetch && window.fetch.__isIntercepted) return;
        const originalFetch = window.fetch;
        if (!originalFetch) return;

        window.fetch = function (resource, options) {
          if (typeof resource === 'string') {
            const isLocalDev = window.location.protocol === 'file:' || 
              ((window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') && window.location.port !== '3001');
            
            if (isLocalDev) {
              if (resource.startsWith('/api/')) {
                resource = 'http://localhost:3001' + resource;
              } else if (resource.startsWith('api/')) {
                resource = 'http://localhost:3001/' + resource;
              } else if (resource === '/api') {
                resource = 'http://localhost:3001/api';
              }
            }
          }
          return originalFetch.call(window, resource, options);
        };
        window.fetch.__isIntercepted = true;
      })();

      // Toggle password visibility
      const passwordInput = document.getElementById("password");
      const togglePasswordBtn = document.getElementById("toggle-password");
      if (togglePasswordBtn && passwordInput) {
        togglePasswordBtn.addEventListener("click", () => {
          if (passwordInput.type === "password") {
            passwordInput.type = "text";
            togglePasswordBtn.textContent = "🙈";
            togglePasswordBtn.title = "Sembunyikan Password";
          } else {
            passwordInput.type = "password";
            togglePasswordBtn.textContent = "👁️";
            togglePasswordBtn.title = "Tampilkan Password";
          }
        });
      }

      document.getElementById("login-form").onsubmit = async (e) => {
        e.preventDefault();
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        try {
          const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });

          const data = await res.json();
          if (data.success) {
            localStorage.setItem("auth_role", data.role);
            localStorage.setItem("auth_user", data.username);
            localStorage.setItem("auth_token", data.token);
            if (data.profilePic)
              localStorage.setItem("auth_profile_pic", data.profilePic);

            if (data.role === "admin" || data.role === "engineer") {
              window.location.href = "admin.html";
            } else if (data.role === "tv") {
              window.location.href = "tv.html";
            } else {
              window.location.href = "index.html";
            }
          } else {
            const errorEl = document.getElementById("login-error");
            errorEl.textContent =
              data.message || "Username atau password salah!";
            errorEl.style.display = "block";
          }
        } catch (err) {
          alert("Tidak dapat terhubung ke server: " + err.message);
        }
      };
    </script>
  </body>
</html>
