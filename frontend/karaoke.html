<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Karaoke | Om Ben Billiard</title>
    <link rel="stylesheet" href="assets/style.css">
    <style>
        .category-tab-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-dim);
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            display: inline-block;
            font-family: var(--font-body);
        }
        .category-tab-btn:hover {
            color: var(--text-light);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        .category-tab-btn.active {
            background: var(--primary-color);
            color: var(--bg-dark);
            font-weight: 700;
            border-color: var(--primary-color);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-section">
                <img src="assets/Logo Baru.jpeg" alt="Logo" class="main-logo">
                <div>
                    <h1>OM BEN BILLIARD</h1>
                    <p>X V3 KARAOKE POS System</p>
                </div>
            </div>
            <nav></nav>
        </header>

        <script src="assets/app.js"></script>
        <script>renderNavbar('karaoke');</script>

        <section class="stats-overview">
            <div class="stat-card">
                <h3>Ruang Tersedia</h3>
                <div class="value" id="available-count">0</div>
            </div>
            <div class="stat-card">
                <h3>Sedang Digunakan</h3>
                <div class="value" id="occupied-count">0</div>
            </div>
            <div class="stat-card admin-only" id="revenue-card">
                <h3>Pendapatan Hari Ini</h3>
                <div class="value" id="today-revenue">Rp 0</div>
            </div>
        </section>

        <!-- Search & Category Filters (Premium Design) -->
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; background: var(--card-bg); padding: 1rem; border-radius: 20px; border: 1px solid var(--glass-border);">
            <div id="dashboard-category-tabs" style="display: flex; gap: 0.5rem; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; padding-bottom: 0.2rem;">
                <!-- Category tabs dynamically injected here -->
            </div>
            <div style="position: relative; min-width: 200px; flex: 1; max-width: 300px;">
                <input type="text" id="search-dashboard-input" placeholder="Cari ruangan..." oninput="handleSearchFilter()" style="width: 100%; background: rgba(255,255,255,0.05); border-radius: 10px; padding: 0.6rem 1rem 0.6rem 2.2rem; color: white; border: 1px solid var(--glass-border); outline: none;">
                <span style="position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 0.9rem;">🔍</span>
            </div>
        </div>

        <section class="table-grid" id="table-container">
            <!-- Room cards will be injected here -->
        </section>
    </div>

    <script>
        if (localStorage.getItem('auth_role') !== 'admin' && localStorage.getItem('auth_role') !== 'engineer') {
            document.getElementById('revenue-card').style.display = 'none';
        }
    </script>

    <!-- Start Session Modal -->
    <div class="modal" id="start-modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 1.5rem; font-family: var(--font-heading);">Mulai Sewa Ruang</h2>
            <form id="start-form">
                <input type="hidden" id="modal-table-id">
                <div class="form-group">
                    <label>ID Member (Opsional)</label>
                    <div style="display: flex; gap: 0.5rem;">
                        <input type="text" id="member-id-input" oninput="onMemberIdInput()" placeholder="Masukkan 8 digit ID Member..." style="flex: 1;" maxlength="20" autocomplete="off">
                        <button type="button" class="btn btn-outline" id="btn-check-member" onclick="checkMemberStatus()" style="width: auto; padding: 0 1rem; color: var(--accent-gold); border-color: rgba(240, 192, 64, 0.3);">Cek</button>
                    </div>
                    <div id="member-feedback" style="font-size: 0.85rem; margin-top: 6px; display: none; font-weight: 600;"></div>
                </div>
                <div class="form-group">
                    <label>Nama Penyewa</label>
                    <input type="text" id="customer-name" placeholder="Contoh: Budi" required>
                </div>
                <div class="form-group" style="display: none;">
                    <label>Tipe Sewa</label>
                    <select id="rental-type">
                        <option value="duration" selected>Durasi (Tentukan waktu)</option>
                    </select>
                </div>
                <div id="duration-group" class="form-group" style="display: block;">
                    <label>Durasi (Menit)</label>
                    <input type="number" id="duration-minutes" placeholder="60" required>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="btn btn-outline" id="close-modal">Batal</button>
                    <button type="submit" class="btn btn-primary" id="start-submit-btn">Mulai Sekarang</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Stop Session Modal -->
    <div class="modal" id="stop-modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 1rem; font-family: var(--font-heading);">Selesaikan Sewa</h2>
            <div id="bill-details" style="margin-bottom: 2rem; background: rgba(255,255,255,0.05); padding: 1.5rem; border-radius: 15px;">
                <!-- Bill info injected here -->
            </div>
            <div style="display: flex; gap: 1rem;">
                <button type="button" class="btn btn-outline" id="close-stop-modal">Batal</button>
                <button type="button" class="btn btn-outline" id="print-receipt-btn" style="color: var(--accent-gold); border-color: rgba(240, 192, 64, 0.3); display: none;">Cetak Struk</button>
                <button type="button" class="btn btn-primary" id="confirm-stop">Selesai & Bayar</button>
            </div>
        </div>
    </div>

    <!-- Order F&B Modal -->
    <div class="modal" id="order-modal">
        <div class="modal-content" style="max-width: 600px;">
            <h2 style="margin-bottom: 1.5rem; font-family: var(--font-heading);">Pesan Makanan & Minuman</h2>
            <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
                <div class="form-group" style="flex: 2; margin: 0;">
                    <label>Ketik/Pilih Menu</label>
                    <input type="text" id="menu-input" placeholder="Cari nama menu..." list="menu-options" autocomplete="off">
                    <datalist id="menu-options"></datalist>
                </div>
                <div class="form-group" style="flex: 1; margin: 0;">
                    <label>Jumlah</label>
                    <input type="number" id="menu-qty" value="1" min="1">
                </div>
                <button class="btn btn-primary" style="width: auto; height: 43px; align-self: flex-end;" onclick="addOrderToSession()">Tambah</button>
            </div>
            
            <h3 style="font-size: 1rem; margin-bottom: 1rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 0.5rem;">Pesanan Ruangan Ini</h3>
            <div style="max-height: 200px; overflow-y: auto; margin-bottom: 2rem;">
                <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem;">
                    <tbody id="session-orders-list">
                        <!-- Existing orders injected here -->
                    </tbody>
                </table>
            </div>

            <div style="display: flex; gap: 1rem;">
                <button type="button" class="btn btn-outline" id="close-order-modal">Tutup</button>
            </div>
        </div>
    </div>

    <script src="assets/karaoke.js?v=1.0.2"></script>
</body>
</html>
