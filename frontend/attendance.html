<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Karyawan | Om Ben Billiard</title>
    <link rel="stylesheet" href="assets/style.css">
    <style>
        body {
            background: radial-gradient(circle at bottom left, #1a1a2e, #0a0a12);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .absensi-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            padding: 2.5rem;
            border-radius: 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .logo-absensi {
            width: 80px;
            height: 80px;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 0 10px var(--primary-color));
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(0, 243, 255, 0.4);
        }

        .staff-selector {
            width: 100%;
            padding: 1.2rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            color: white;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            appearance: none;
            cursor: pointer;
            text-align: center;
        }

        .staff-selector option {
            background: #0a0a12;
            color: white;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn-absen {
            padding: 1.5rem;
            border-radius: 20px;
            border: none;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-masuk {
            background: linear-gradient(135deg, #00f3ff, #4facfe);
            color: #000;
            box-shadow: 0 10px 20px rgba(0,243,255,0.2);
        }

        .btn-pulang {
            background: linear-gradient(135deg, #facd15, #f59e0b);
            color: #000;
            box-shadow: 0 10px 20px rgba(250,204,21,0.2);
        }

        .btn-absen:active {
            transform: scale(0.95);
        }

        .status-msg {
            margin-top: 2rem;
            font-size: 0.9rem;
            padding: 1rem;
            border-radius: 12px;
            display: none;
        }

        .success { background: rgba(0,255,0,0.1); color: #4ade80; border: 1px solid rgba(0,255,0,0.2); }
        .error { background: rgba(255,0,0,0.1); color: #f87171; border: 1px solid rgba(255,0,0,0.2); }

        .clock-display {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            font-family: monospace;
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="absensi-card">
        <img src="assets/Logo Baru.jpeg" alt="Logo" class="logo-absensi">
        <h1 style="font-family: var(--font-heading); margin-bottom: 0.5rem;">PRESENSI STAF</h1>
        <p style="color: var(--text-dim); margin-bottom: 2rem; font-size: 0.8rem;">Silakan pilih nama dan tekan tombol sesuai waktu shift.</p>

        <div class="clock-display" id="live-clock">00:00:00</div>
        <p id="live-date" style="font-size: 0.8rem; color: var(--text-dim); margin-bottom: 2rem;">Kamis, 1 Januari 1970</p>

        <select id="staff-select" class="staff-selector">
            <option value="" disabled selected>-- PILIH NAMA ANDA --</option>
        </select>

        <div class="btn-grid">
            <button class="btn-absen btn-masuk" onclick="submitAbsen('in')">MASUK</button>
            <button class="btn-absen btn-pulang" onclick="submitAbsen('out')">PULANG</button>
        </div>

        <div id="status-msg" class="status-msg"></div>
        
        <div style="margin-top: 2rem;">
            <a href="login.html" style="color: var(--text-dim); text-decoration: none; font-size: 0.75rem;">â† Kembali ke Login</a>
        </div>
    </div>

    <script src="assets/app.js"></script>
    <script>
        // Update Clock
        function updateClock() {
            const now = getSyncedNow();
            document.getElementById('live-clock').textContent = now.toLocaleTimeString('id-ID');
            document.getElementById('live-date').textContent = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Load Employee List
        async function loadEmployees() {
            try {
                const employees = await (await fetch('/api/employees')).json();
                const select = document.getElementById('staff-select');
                employees.sort((a,b) => a.name.localeCompare(b.name)).forEach(emp => {
                    const opt = document.createElement('option');
                    opt.value = emp.name;
                    opt.textContent = emp.name + " (" + emp.role + ")";
                    select.appendChild(opt);
                });
            } catch (e) {
                showMsg('Gagal memuat daftar karyawan', 'error');
            }
        }

        async function submitAbsen(type) {
            const name = document.getElementById('staff-select').value;
            const msgDiv = document.getElementById('status-msg');
            
            if (!name) {
                showMsg('Pilih nama Anda terlebih dahulu!', 'error');
                return;
            }

            try {
                const response = await fetch('/api/attendance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        employeeName: name,
                        type: type
                    })
                });
                
                if (response.ok) {
                    showMsg(`Berhasil! Selamat ${type === 'in' ? 'Bekerja' : 'Istirahat'}, ${name}.`, 'success');
                    document.getElementById('staff-select').value = "";
                } else {
                    showMsg('Terjadi kesalahan pada server.', 'error');
                }
            } catch (e) {
                showMsg('Koneksi terputus.', 'error');
            }
        }

        function showMsg(text, type) {
            const div = document.getElementById('status-msg');
            div.textContent = text;
            div.className = `status-msg ${type}`;
            div.style.display = 'block';
            setTimeout(() => div.style.display = 'none', 5000);
        }

        loadEmployees();
    </script>
</body>
</html>
